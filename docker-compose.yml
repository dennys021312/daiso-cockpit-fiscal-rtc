version: "3.9"

services:
  # 1. Motor Oficial da Receita Federal (Java 25 / Spring Boot 4)
  # Pré-requisito: clonar o repositório ReceitaFederal/calculadora-rtc-regime-regular nesta pasta
  calculadora-rfb:
    build:
      context: ./calculadora-rtc-regime-regular
    container_name: rfb-calculadora-rtc
    environment:
      - SPRING_PROFILES_ACTIVE=offline
    ports:
      - "8080:8080"
    restart: unless-stopped

  # 2. Cockpit Fiscal RTC (Frontend estático)
  cockpit-fiscal:
    image: nginx:alpine
    container_name: daiso-cockpit-fiscal
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "8088:80"
    depends_on:
      - calculadora-rfb
    restart: unless-stopped